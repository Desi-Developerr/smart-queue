<!DOCTYPE html>
<html>
<head>
  <title>Smart Queue Demo</title>
</head>
<body>
  <h1>Smart Queue Project</h1>
  <div id="result"></div>

  <script>
    // Backend se connect karne ka example
    fetch("http://localhost:5000/api/queue")
      .then(response => response.json())
      .then(data => {
        document.getElementById("result").innerText = "Backend Response: " + JSON.stringify(data);
      })
      .catch(err => {
        document.getElementById("result").innerText = "Error connecting backend!";
      });
  </script>
</body>
</html>
